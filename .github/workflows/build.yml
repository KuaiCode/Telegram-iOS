name: Build Airygram unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: airygram-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Generate build configuration
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python3 scripts/ci_unsigned_configuration.py

      - name: Select required Xcode
        run: |
          XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Required Xcode ${XCODE_VERSION} is not installed on this runner."
            exit 1
          fi
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version
          test "$(uname -m)" = arm64
          df -h .

      - name: Build unsigned device IPA
        run: |
          mkdir -p build/artifacts
          # The pinned rules_apple otherwise requires profiles even when signing is disabled.
          git -C build-system/bazel-rules/rules_apple apply --check "$GITHUB_WORKSPACE/build-system/patches/rules-apple-unsigned-profiles.patch"
          git -C build-system/bazel-rules/rules_apple apply "$GITHUB_WORKSPACE/build-system/patches/rules-apple-unsigned-profiles.patch"
          python3 scripts/check_ci_unsigned_rules.py
          # These settings apply only to this disposable CI checkout.
          cat >> .bazelrc <<'EOF'

          build --//Telegram:disableProvisioningProfiles
          build --features=disable_legacy_signing
          build --jobs=3
          EOF
          BUILD_NUMBER=$(( $(cat build_number_offset) + GITHUB_RUN_NUMBER ))
          python3 -u build-system/Make/Make.py \
            build \
            --target=//Telegram:Swiftgram \
            --configurationPath=build-input/ci-unsigned-configuration.json \
            --xcodeManagedCodesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --outputBuildArtifactsPath=build/artifacts \
            2>&1 | tee build/build.log
          mv build/artifacts/Swiftgram.ipa build/artifacts/Airygram-unsigned.ipa
          mv build/artifacts/Swiftgram.DSYMs.zip build/artifacts/Airygram.DSYMs.zip
          unzip -tq build/artifacts/Airygram-unsigned.ipa

      - name: Upload IPA and debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: Airygram-unsigned-${{ github.run_number }}
          path: build/artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build log
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Airygram-build-log-${{ github.run_number }}
          path: build/build.log
          if-no-files-found: ignore
          retention-days: 14
